name: Build Fairyclient APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required SDK packages
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # Lets you commit the project as a plain .zip (e.g. uploaded straight
      # from a phone, no local extraction needed). If any .zip file is
      # found in the repo, it's extracted here before the build runs.
      - name: Extract project zip if present
        run: |
          ZIP_FILE=$(find "$GITHUB_WORKSPACE" -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE — extracting..."
            unzip -o -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/_extracted"
          else
            echo "No zip found in repo root — assuming project files were committed directly."
          fi

      # Finds the real project root no matter how deep settings.gradle
      # ended up (inside the extracted zip, inside a nested folder from a
      # phone upload, or at the repo root directly). Everything after this
      # step runs with that folder as the working directory, so no manual
      # reorganizing is needed either way.
      - name: Locate project root
        id: locate
        run: |
          MATCH=$(find "$GITHUB_WORKSPACE" -maxdepth 6 -name settings.gradle -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$MATCH" ]; then
            echo "Could not find settings.gradle anywhere under the repo (checked extracted zip too)." >&2
            exit 1
          fi
          DIR=$(dirname "$MATCH")
          echo "Found project root: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle wrapper jar
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle wrapper --gradle-version 8.7

      - name: Make gradlew executable
        working-directory: ${{ steps.locate.outputs.dir }}
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fairyclient-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          
